[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ach-diffraction-suite"
version = "0.2.0"
description = "PXRD and TOPAS analysis tools: Pawley fit setup, prefitting, plotting, and lattice-parameter tables."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

# pymatgen is needed by four of the five tools, so it is not an optional extra.
# scipy (prefit) and beautifulsoup4 (tables) are single-tool dependencies, but
# splitting them into extras would mean a user who runs `pf` after installing
# without extras gets an ImportError instead of a working tool. For a five-tool
# lab suite the simpler contract is: one install, everything works.
dependencies = [
    "numpy",
    "matplotlib",
    "pymatgen",
    "scipy",
    "beautifulsoup4",
    "platformdirs",
]

[project.scripts]
# Note: `pf` moved from tables to prefit in 0.2.0, and tables became `pt`.
# Anyone with muscle memory for the old `pf` will land on prefit instead.
pp  = "achdiff.tools.plotter:main"
rp  = "achdiff.tools.wizard:main"
pf  = "achdiff.tools.prefit:main"
pt  = "achdiff.tools.tables:main"
pq  = "achdiff.tools.quickplot:main"
# Umbrella command: `achdiff alias` manages user-defined shorthands, since pip
# entry points above are fixed at install time and cannot be renamed by a user.
achdiff = "achdiff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
