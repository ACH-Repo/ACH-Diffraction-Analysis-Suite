[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ach-diffraction-suite"
version = "0.12.0"
description = "PXRD and TOPAS analysis tools: Pawley fit setup, prefitting, plotting, and lattice-parameter tables."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
# Name only. `authors` attributes the work; the affiliation belongs in LICENSE
# (where it already is) and the README, and there is no PyPI field for it.
# No email: PyPI author addresses are scraped, and project.urls.Issues below
# already gives people a way to make contact.
authors = [{ name = "Christian Nelle" }]
keywords = ["pxrd", "xrd", "topas", "pawley", "rietveld", "crystallography", "diffraction"]

classifiers = [
    # 0.x: interfaces may still change between releases.
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Environment :: Console",
]

# scipy (prefit) and beautifulsoup4 (tables) are single-tool dependencies, but
# splitting them into extras would mean a user who runs `pf` after installing
# without extras gets an ImportError instead of a working tool. For a five-tool
# lab suite the simpler contract is: one install, everything works.
#
# pymatgen was dropped in 0.8.0. Its CifParser refuses files this lab produces
# -- a site occupancy above its tolerance discards the whole data block, and
# several refinement programs write that column as atoms-per-site -- so a good
# file would raise "Invalid CIF file with no structures!" and the phase would
# vanish from the plot. The crystallography now comes from the vendored MoloM
# core in achdiff/core/_molom/, which needs only numpy and spglib. That also
# takes pandas, sympy, monty, networkx and the rest of pymatgen's tree out of a
# lab install.
dependencies = [
    "numpy",
    "matplotlib",
    # Space-group symbol -> symmetry operations, and symmetry FROM coordinates
    # (prefit's crystal-system detection). Used through core/_molom.
    "spglib",
    "scipy",
    "beautifulsoup4",
    "platformdirs",
    # tomllib is stdlib only from 3.11. Without this, config.py finds no TOML
    # parser on 3.10 and every profile, alias and trusted set silently reads as
    # empty -- the tools still run, just with none of the user's settings. It
    # went unnoticed because build/pytest/pipx happen to install tomli on a
    # development machine, and a lab user has none of those.
    'tomli >= 1.1.0 ; python_version < "3.11"',
]

# Sub-tables must follow every plain key of [project]; a table opened above
# `dependencies` would capture it as project.urls.dependencies instead.
[project.urls]
Homepage = "https://github.com/ACH-Repo/ACH-Diffraction-Analysis-Suite"
Repository = "https://github.com/ACH-Repo/ACH-Diffraction-Analysis-Suite"
Issues = "https://github.com/ACH-Repo/ACH-Diffraction-Analysis-Suite/issues"

[project.scripts]
# Note: `pf` moved from tables to prefit in 0.2.0, and tables became `pt`.
# Anyone with muscle memory for the old `pf` will land on prefit instead.
pp  = "achdiff.tools.plotter:main"
rp  = "achdiff.tools.wizard:main"
pf  = "achdiff.tools.prefit:main"
pt  = "achdiff.tools.tables:main"
pq  = "achdiff.tools.quickplot:main"
# Umbrella command: `achdiff alias` manages user-defined shorthands, since pip
# entry points above are fixed at install time and cannot be renamed by a user.
achdiff = "achdiff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# resource.htm is a real data file, not an embedded blob -- it must ship in the wheel.
[tool.setuptools.package-data]
achdiff = ["data/*.htm"]
